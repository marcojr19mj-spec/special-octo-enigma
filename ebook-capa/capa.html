<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Do balbucio à conversa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f0e6; --ink:#24233f; --muted:#6e6a7c; --line:#d9d0c2;
    --sand:#eadbc6; --mustard:#ecb94a; --clay:#c2562e; --teal:#3f7f78; --navy:#2b2a4a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:2400px;background:var(--bg)}
  body{font-family:"Poppins",sans-serif;color:var(--ink);position:relative;overflow:hidden}
  /* textura de papel discreta */
  body::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  .page{position:absolute;inset:0;padding:150px 150px 140px;display:flex;flex-direction:column}

  .top{display:flex;justify-content:space-between;align-items:baseline;
    font-size:30px;letter-spacing:.32em;text-transform:uppercase}
  .top .name{font-weight:700}
  .top .role{font-weight:500;color:var(--muted);font-size:26px}

  /* conversa que cresce com a idade */
  .chat{margin-top:150px;display:flex;flex-direction:column;gap:46px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:40px}
  .age{font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:22px}
  .age::before{content:"";width:46px;height:2px;background:var(--line)}
  .b{position:relative;font-weight:600;line-height:1.12;border-radius:40px;
    padding:.42em .78em .48em;letter-spacing:-.01em}
  .b::after{content:"";position:absolute;left:58px;bottom:-26px;width:44px;height:30px;
    background:inherit;clip-path:polygon(0 0,100% 0,0 100%)}
  .b1{font-size:42px;background:#e7e3ea;color:var(--navy)}
  .b2{font-size:50px;background:var(--sand);color:var(--navy)}
  .b3{font-size:60px;background:var(--mustard);color:var(--navy)}
  .b4{font-size:70px;background:var(--clay);color:#fff8ef}
  .b5{font-size:76px;background:var(--teal);color:#fff8ef}
  .b6{font-size:80px;background:var(--navy);color:#fff8ef;border-radius:48px}

  .title{margin-top:auto;font-weight:800;font-size:212px;line-height:.92;letter-spacing:-.035em}
  .title span{color:var(--clay)}
  .sub{margin-top:56px;font-size:46px;line-height:1.38;font-weight:500;color:#3d3b55;max-width:1080px}
  .foot{margin-top:84px;padding-top:44px;border-top:2px solid var(--line);
    display:flex;justify-content:space-between;font-size:26px;letter-spacing:.3em;text-transform:uppercase}
  .foot b{font-weight:700}
  .foot span{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div class="page">
  <header class="top"><span class="name">Exillany Mota</span><span class="role">Fonoaudióloga</span></header>

  <div class="chat">
    <div class="row"><div class="b b1">ahh</div><div class="age">6 meses</div></div>
    <div class="row"><div class="b b2">mamã</div><div class="age">1 ano</div></div>
    <div class="row"><div class="b b3">quer água</div><div class="age">1 ano e meio</div></div>
    <div class="row"><div class="b b4">eu quero bola</div><div class="age">2 anos</div></div>
    <div class="row"><div class="b b5">a vovó trouxe bolo!</div><div class="age">3 anos</div></div>
    <div class="row"><div class="b b6">mãe, por que a lua<br>segue a gente?</div><div class="age">4 anos</div></div>
  </div>

  <h1 class="title">Do balbucio<br>à <span>conversa</span></h1>
  <p class="sub">Como acompanhar e estimular a fala do seu filho, de 0&nbsp;a&nbsp;5&nbsp;anos</p>
  <footer class="foot"><b>Com 50 brincadeiras por idade</b><span>Guia para pais</span></footer>
</div>
</body>
</html>
